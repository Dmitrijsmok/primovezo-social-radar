name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/primovezo-more-sources

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q
      - name: Sentiment quality gate
        run: uv run harken evaluate --min-accuracy 0.95 --show-failures 0
